<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#080a0f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Nocturia Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
/* ─── RESET & VARIABLES ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #080a0f;
  --bg-mid:       #0d0f17;
  --bg-panel:     #10131c;
  --bg-card:      #161925;
  --border:       #1e2235;
  --border-glow:  #7c5cbf;
  --purple:       #7c5cbf;
  --purple-light: #a988e8;
  --purple-dim:   #3d2c6e;
  --silver:       #c8cfe0;
  --silver-dim:   #606880;
  --gold:         #c9a227;
  --gold-light:   #e8c84a;
  --gold-dim:     #7a631a;
  --crimson:      #8b1a1a;
  --text-main:    #c0c8de;
  --text-dim:     #505870;
  --text-head:    #dde3f4;
  --accent:       var(--purple);
  --accent-light: var(--purple-light);
  --accent-dim:   var(--purple-dim);
  --scrollbar-w:  5px;
  --sidebar-w:    280px;
  --toc-w:        220px;
  --header-h:     60px;
  --mobile-nav-h: 56px;
  --radius:       10px;
  --transition:   .22s cubic-bezier(.4,0,.2,1);
}

/* Light mode support (optional future toggle) */
@media (prefers-color-scheme: light) {
  :root.auto-theme {
    --bg-deep: #f0eff8; --bg-mid: #e8e6f3; --bg-panel: #fff;
    --bg-card: #f7f6fc; --border: #d0cce8;
    --text-main: #2a2640; --text-dim: #8886a0; --text-head: #1a1830;
  }
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Crimson Pro', Georgia, serif;
  background: var(--bg-deep);
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
  /* safe area for notched phones */
  padding-bottom: env(safe-area-inset-bottom);
}

/* ─── SCROLLBAR ──────────────────────────────────────────────────── */
::-webkit-scrollbar { width: var(--scrollbar-w); height: var(--scrollbar-w); }
::-webkit-scrollbar-track { background: var(--bg-mid); }
::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }


/* ─── READING PROGRESS BAR ───────────────────────────────────────── */
#read-progress {
  position: fixed; top: 0; left: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent-dim), var(--accent-light));
  width: 0%;
  z-index: 9999;
  transition: width .1s linear;
  box-shadow: 0 0 8px rgba(169,136,232,.5);
  pointer-events: none;
}

/* ─── HEADER ─────────────────────────────────────────────────────── */
header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: linear-gradient(180deg, rgba(8,10,15,.98) 0%, rgba(8,10,15,.92) 100%);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  padding-right: max(20px, env(safe-area-inset-right));
  padding-left: max(20px, env(safe-area-inset-left));
  z-index: 200;
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 2px 20px rgba(0,0,0,.6);
}

.logo-rune {
  width: 36px; height: 36px;
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cinzel', serif;
  font-size: 17px; font-weight: 900;
  color: var(--accent-light);
  box-shadow: 0 0 14px rgba(124,92,191,.3), inset 0 0 8px rgba(124,92,191,.1);
  text-shadow: 0 0 10px rgba(169,136,232,.7);
  flex-shrink: 0;
  cursor: pointer;
  transition: box-shadow var(--transition), transform var(--transition);
  user-select: none;
}
.logo-rune:hover {
  box-shadow: 0 0 22px rgba(124,92,191,.55), inset 0 0 14px rgba(124,92,191,.18);
  transform: scale(1.05);
}

.logo-text {
  font-family: 'Cinzel', serif;
  font-weight: 700; font-size: 1.05rem;
  color: var(--text-head);
  letter-spacing: .12em; line-height: 1;
  cursor: pointer; user-select: none;
}
.logo-text span {
  display: block; font-size: .55rem;
  font-weight: 400; color: var(--accent-dim);
  letter-spacing: .22em; margin-top: 3px;
  text-transform: uppercase;
}

/* Nav History */
.nav-history { display: flex; gap: 4px; }
.nav-btn {
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text-dim);
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem;
  transition: all var(--transition);
}
.nav-btn:hover:not(:disabled) { color: var(--accent-light); border-color: var(--accent-dim); background: rgba(124,92,191,.08); }
.nav-btn:disabled { opacity: .3; cursor: default; }

.header-divider { flex: 1; }

/* Header actions */
.header-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text-dim);
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: .95rem;
  transition: all var(--transition);
  position: relative;
}
.icon-btn:hover { color: var(--accent-light); border-color: var(--accent-dim); background: rgba(124,92,191,.08); }
.icon-btn[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 5px; padding: 4px 8px;
  font-family: 'Cinzel', serif; font-size: .58rem; letter-spacing: .06em;
  color: var(--text-main); white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity .15s;
  z-index: 1000;
}
.icon-btn:hover[data-tooltip]::after { opacity: 1; }

/* Font size indicator */
.font-size-display {
  font-family: 'Cinzel', serif; font-size: .58rem;
  color: var(--text-dim); letter-spacing: .05em;
  white-space: nowrap;
}

/* ─── SEARCH WRAPPER ─────────────────────────────────────────────── */
.search-wrapper { position: relative; }
#search-box {
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 36px 7px 14px;
  color: var(--text-main);
  font-family: 'Crimson Pro', serif;
  font-size: 1rem;
  width: 200px; outline: none;
  transition: border-color var(--transition), box-shadow var(--transition), width var(--transition);
}
#search-box::placeholder { color: var(--text-dim); font-style: italic; }
#search-box:focus {
  border-color: var(--accent-dim);
  box-shadow: 0 0 0 3px rgba(124,92,191,.15);
  width: 260px;
}
.search-kbd {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-size: .58rem; font-family: 'Cinzel', serif;
  color: var(--text-dim); background: rgba(255,255,255,.05);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 1px 5px; pointer-events: none; transition: opacity .2s;
}
#search-box:focus ~ .search-kbd { opacity: 0; }
.search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 1rem; line-height: 1;
  padding: 2px; display: none; transition: color .2s;
}
.search-clear:hover { color: var(--accent-light); }
.search-clear.visible { display: block; }

/* ─── SEARCH DROPDOWN ────────────────────────────────────────────── */
#search-dropdown {
  position: absolute; top: calc(100% + 8px); right: 0;
  width: 420px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.8), 0 0 0 1px rgba(124,92,191,.08);
  overflow: hidden; z-index: 500;
  display: none; animation: dropIn .18s ease;
}
#search-dropdown.open { display: block; }
@keyframes dropIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }

.search-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
}
.search-count { font-family: 'Cinzel', serif; font-size: .58rem; letter-spacing: .1em; color: var(--text-dim); }
.search-hint { font-size: .75rem; color: var(--text-dim); font-style: italic; }
.search-section-label {
  font-family: 'Cinzel', serif; font-size: .55rem; letter-spacing: .15em;
  color: var(--accent-dim); text-transform: uppercase; padding: 8px 14px 4px;
}
.search-list { max-height: 360px; overflow-y: auto; }
.search-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; cursor: pointer;
  transition: background .15s; border-left: 2px solid transparent;
}
.search-item:hover, .search-item.focused { background: rgba(124,92,191,.06); border-left-color: var(--accent-dim); }
.search-item.focused { background: rgba(124,92,191,.1); border-left-color: var(--accent); }
.search-item-icon {
  width: 28px; height: 28px; border-radius: 6px;
  background: rgba(124,92,191,.1); border: 1px solid rgba(124,92,191,.2);
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem; color: var(--accent-dim); flex-shrink: 0;
  font-family: 'Cinzel', serif;
}
.search-item-body { flex: 1; min-width: 0; }
.search-item-title {
  font-family: 'Cinzel', serif; font-size: .83rem;
  color: var(--text-head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.search-item-title mark { background: rgba(124,92,191,.25); color: var(--accent-light); border-radius: 2px; padding: 0 1px; }
.search-item-sub { font-size: .78rem; color: var(--text-dim); font-style: italic; }
.search-item-arrow { color: var(--text-dim); font-size: .8rem; opacity: 0; transition: opacity .15s; }
.search-item:hover .search-item-arrow, .search-item.focused .search-item-arrow { opacity: 1; color: var(--accent-light); }
.search-empty { padding: 28px 14px; text-align: center; color: var(--text-dim); font-style: italic; font-size: .95rem; }
.search-divider { height: 1px; background: var(--border); margin: 4px 0; }
.recent-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; cursor: pointer; transition: background .15s;
  color: var(--text-dim); font-style: italic; font-size: .9rem;
}
.recent-item:hover { background: rgba(255,255,255,.03); color: var(--text-main); }
.recent-item svg { flex-shrink: 0; opacity: .5; }
.recent-clear {
  font-family: 'Cinzel', serif; font-size: .55rem; letter-spacing: .1em;
  color: var(--text-dim); background: none; border: none;
  cursor: pointer; padding: 8px 14px; display: block;
  width: 100%; text-align: right; transition: color .2s;
}
.recent-clear:hover { color: var(--accent-light); }

/* ─── LAYOUT ─────────────────────────────────────────────────────── */
#layout {
  display: flex;
  padding-top: var(--header-h);
  min-height: 100vh;
  position: relative;
}

/* ─── SIDEBAR ────────────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  position: fixed;
  top: var(--header-h); bottom: 0; left: 0;
  overflow-y: auto; overflow-x: hidden;
  padding-bottom: 32px;
  transition: transform var(--transition);
  z-index: 100;
}

/* Tab pills */
.tab-bar {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 12px 10px 8px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: var(--bg-panel); z-index: 10;
}
.tab-pill {
  font-family: 'Cinzel', serif; font-size: .58rem; font-weight: 600;
  letter-spacing: .1em; padding: 4px 10px;
  border-radius: 20px; border: 1px solid var(--border);
  background: transparent; color: var(--text-dim);
  cursor: pointer; transition: all var(--transition); white-space: nowrap;
}
.tab-pill:hover { color: var(--text-main); border-color: var(--accent-dim); }
.tab-pill.active {
  background: linear-gradient(135deg, var(--accent-dim), var(--accent));
  color: #e8e0f8; border-color: var(--accent);
  box-shadow: 0 0 12px rgba(124,92,191,.3);
}

/* Recently visited */
.recent-pages-section { padding: 0; }
.recent-pages-title {
  font-family: 'Cinzel', serif; font-size: .58rem; letter-spacing: .16em;
  color: var(--accent-dim); padding: 12px 16px 6px;
  display: flex; align-items: center; gap: 6px;
  text-transform: uppercase; opacity: .8;
}
.recent-pages-list { padding-bottom: 8px; }
.recent-page-link {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 16px 5px 22px;
  color: var(--text-dim); font-size: .85rem; font-style: italic;
  cursor: pointer; transition: color .15s;
}
.recent-page-link:hover { color: var(--accent-light); }
.recent-page-dot { font-size: .4rem; color: var(--accent-dim); flex-shrink: 0; }

/* Nav sections */
.nav-section { display: none; }
.nav-section.visible { display: block; }
.nav-section-title {
  font-family: 'Cinzel', serif; font-size: .62rem; font-weight: 700;
  letter-spacing: .18em; color: var(--accent-dim);
  padding: 14px 16px 6px; text-transform: uppercase;
}
.nav-link {
  display: block; padding: 7px 16px 7px 22px;
  color: var(--text-main); font-size: 1rem; font-style: italic;
  text-decoration: none; border-left: 2px solid transparent;
  transition: all .18s; cursor: pointer; position: relative;
  /* better touch target */
  min-height: 38px; display: flex; align-items: center;
}
.nav-link::before {
  content: '◆'; font-style: normal; font-size: .42rem;
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  color: var(--accent-dim); opacity: 0; transition: opacity .18s;
}
.nav-link:hover { color: var(--accent-light); border-left-color: var(--accent-dim); padding-left: 24px; }
.nav-link:hover::before { opacity: 1; }
.nav-link.active { color: var(--accent-light); border-left-color: var(--accent); font-style: normal; font-weight: 600; }
.nav-link.active::before { opacity: 1; color: var(--accent); }

/* Sidebar footer */
.sidebar-footer {
  padding: 16px 16px 12px;
  border-top: 1px solid var(--border); margin-top: 12px;
  font-size: .8rem; color: var(--text-dim); font-style: italic; line-height: 1.5;
}

/* ─── MAIN ───────────────────────────────────────────────────────── */
#main {
  margin-left: var(--sidebar-w);
  flex: 1; padding: 32px 44px 80px;
  min-height: calc(100vh - var(--header-h));
  max-width: calc(860px + var(--toc-w));
  position: relative;
}

/* ─── BREADCRUMB ─────────────────────────────────────────────────── */
#breadcrumb {
  display: flex; align-items: center; gap: 6px;
  font-size: .76rem; color: var(--text-dim);
  margin-bottom: 18px;
  font-family: 'Cinzel', serif; letter-spacing: .06em;
  flex-wrap: wrap;
}
#breadcrumb.hidden { display: none; }
.bc-item { color: var(--text-dim); cursor: pointer; transition: color .15s; }
.bc-item:hover { color: var(--accent-light); }
.bc-sep { color: var(--border); font-size: .7rem; }
.bc-current { color: var(--text-main); cursor: default; }

/* ─── TOC RAIL ───────────────────────────────────────────────────── */
#toc-rail {
  position: fixed; top: var(--header-h); right: 0;
  width: var(--toc-w); height: calc(100vh - var(--header-h));
  overflow-y: auto; padding: 22px 14px 32px;
  border-left: 1px solid var(--border);
  background: var(--bg-panel); display: none; z-index: 50;
}
#toc-rail.visible { display: block; }
.toc-title {
  font-family: 'Cinzel', serif; font-size: .58rem; letter-spacing: .18em;
  color: var(--accent-dim); text-transform: uppercase;
  margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.toc-list { list-style: none; }
.toc-item { font-size: .82rem; line-height: 1.4; margin-bottom: 2px; }
.toc-link {
  display: block; color: var(--text-dim); text-decoration: none;
  padding: 3px 6px; border-left: 2px solid transparent;
  border-radius: 0 4px 4px 0; transition: all .15s; cursor: pointer;
}
.toc-link:hover { color: var(--accent-light); border-left-color: var(--accent-dim); }
.toc-link.active { color: var(--accent-light); border-left-color: var(--accent); }
.toc-h3 { padding-left: 14px; font-size: .76rem; }

/* ─── CONTENT AREA ───────────────────────────────────────────────── */
#content-area { max-width: 800px; }
#content-area.has-toc { margin-right: calc(var(--toc-w) + 20px); }

/* ─── STATE PLACEHOLDER ──────────────────────────────────────────── */
.state-placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 50vh; text-align: center; gap: 14px;
}
.state-rune {
  font-family: 'Cinzel', serif; font-size: 3rem;
  color: var(--accent-dim); opacity: .4;
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity:.25; transform:scale(1); } 50% { opacity:.65; transform:scale(1.06); } }
.state-msg {
  font-family: 'Cinzel', serif; font-size: .88rem;
  letter-spacing: .12em; color: var(--text-dim);
}
.retry-btn {
  font-family: 'Cinzel', serif; font-size: .7rem; letter-spacing: .1em;
  padding: 8px 20px; border-radius: 6px;
  border: 1px solid var(--accent-dim); background: rgba(124,92,191,.1);
  color: var(--accent-light); cursor: pointer; transition: all var(--transition);
  margin-top: 4px;
}
.retry-btn:hover { background: rgba(124,92,191,.2); border-color: var(--accent); }

/* ─── ARTICLE STYLES ─────────────────────────────────────────────── */
#article { animation: fadeIn .4s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

#article h1 {
  font-family: 'Cinzel', serif; font-size: 2.3rem; font-weight: 700;
  color: var(--text-head); letter-spacing: .06em;
  padding-bottom: 14px; border-bottom: 1px solid var(--border);
  margin-bottom: 24px; position: relative; line-height: 1.25;
}
#article h1::after {
  content: ''; position: absolute; bottom: -1px; left: 0;
  width: 56px; height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
  box-shadow: 0 0 10px rgba(124,92,191,.5);
}
#article h2 {
  font-family: 'Cinzel', serif; font-size: 1.35rem; font-weight: 600;
  color: var(--accent-light); letter-spacing: .05em;
  margin: 34px 0 12px; padding-bottom: 8px;
  border-bottom: 1px solid rgba(124,92,191,.2);
  scroll-margin-top: calc(var(--header-h) + 16px);
}
#article h3 {
  font-family: 'Cinzel', serif; font-size: 1.05rem;
  color: var(--text-head); margin: 22px 0 10px;
  letter-spacing: .06em; scroll-margin-top: calc(var(--header-h) + 16px);
}
#article h4 {
  font-family: 'Cinzel', serif; font-size: .9rem;
  color: var(--silver); margin: 18px 0 8px; letter-spacing: .05em;
}
#article p { line-height: 1.82; margin-bottom: 15px; font-size: var(--article-font-size, 1.08rem); }
#article blockquote {
  border-left: 3px solid var(--accent-dim); margin: 18px 0; padding: 14px 20px;
  background: rgba(124,92,191,.05); border-radius: 0 8px 8px 0;
  font-style: italic; color: #a09acc;
}
#article blockquote p { margin: 0; }
#article a {
  color: var(--accent-light); text-decoration: none;
  border-bottom: 1px dotted var(--accent-dim); transition: color .15s, border-color .15s;
}
#article a:hover { color: #fff; border-bottom-color: var(--accent); }
#article img {
  max-width: 100%; border-radius: 8px; border: 1px solid var(--border);
  margin: 14px 0; box-shadow: 0 4px 24px rgba(0,0,0,.5);
  cursor: zoom-in; transition: transform .2s;
}
#article img:hover { transform: scale(1.01); }
#article ul, #article ol { margin: 12px 0 16px 26px; line-height: 1.82; font-size: var(--article-font-size, 1.08rem); }
#article li { margin-bottom: 5px; }
#article code {
  background: rgba(124,92,191,.1); border: 1px solid rgba(124,92,191,.2);
  border-radius: 4px; padding: 1px 6px; font-size: .88em;
  color: var(--accent-light); font-family: 'Fira Code', 'Consolas', monospace;
}
#article pre {
  background: rgba(0,0,0,.4); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px 20px; overflow-x: auto;
  margin: 16px 0; position: relative;
}
#article pre code { background: none; border: none; padding: 0; font-size: .88rem; color: var(--silver); }
#article hr { border: none; border-top: 1px solid var(--border); margin: 30px 0; }
#article table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 1rem; overflow-x: auto; display: block; }
#article th {
  font-family: 'Cinzel', serif; font-size: .73rem; letter-spacing: .08em;
  color: var(--accent-dim); text-align: left;
  border-bottom: 1px solid var(--border); padding: 8px 12px;
  white-space: nowrap;
}
#article td { padding: 8px 12px; border-bottom: 1px solid rgba(30,34,53,.5); line-height: 1.5; }
#article tr:hover td { background: rgba(124,92,191,.04); }

/* Article meta */
.article-meta {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px;
}
.badge {
  font-family: 'Cinzel', serif; font-size: .56rem; letter-spacing: .12em;
  background: rgba(124,92,191,.12); border: 1px solid rgba(124,92,191,.28);
  color: var(--accent-dim); padding: 3px 10px; border-radius: 20px;
  text-transform: uppercase;
}
.meta-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.meta-btn {
  font-size: .76rem; color: var(--text-dim); text-decoration: none;
  font-style: italic; opacity: .65; transition: opacity .2s, color .2s;
  display: flex; align-items: center; gap: 4px;
  background: none; border: none; cursor: pointer;
  font-family: 'Crimson Pro', serif;
}
.meta-btn:hover { opacity: 1; color: var(--accent-light); }
.meta-sep { color: var(--border); font-size: .8rem; }

/* ─── SEARCH RESULTS PAGE ────────────────────────────────────────── */
.search-results-page { animation: fadeIn .3s ease; }
.search-result-grid { display: grid; gap: 10px; margin-top: 20px; }
.search-result-item {
  padding: 14px 18px; border: 1px solid var(--border);
  border-radius: 9px; cursor: pointer; transition: all .2s;
  background: var(--bg-card); display: flex; align-items: center; gap: 14px;
}
.search-result-item:hover {
  border-color: var(--accent-dim); background: rgba(124,92,191,.05); transform: translateX(3px);
}
.search-result-icon {
  width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px;
  background: rgba(124,92,191,.1); border: 1px solid rgba(124,92,191,.2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cinzel', serif; font-size: .8rem; color: var(--accent-dim);
}
.search-result-body { flex: 1; }
.search-result-title { font-family: 'Cinzel', serif; font-size: .95rem; color: var(--text-head); margin-bottom: 3px; }
.search-result-title mark { background: rgba(124,92,191,.2); color: var(--accent-light); border-radius: 2px; }
.search-result-sub { font-size: .85rem; color: var(--text-dim); font-style: italic; }
.search-result-arrow { color: var(--text-dim); font-size: 1.1rem; }

/* ─── HOME GRID ──────────────────────────────────────────────────── */
.home-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 12px; margin-top: 24px;
}
.home-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 16px;
  cursor: pointer; transition: all .22s; text-decoration: none;
}
.home-card:hover {
  border-color: var(--accent-dim); transform: translateY(-3px);
  box-shadow: 0 8px 28px rgba(0,0,0,.5), 0 0 20px rgba(124,92,191,.08);
}
.home-card-label {
  font-family: 'Cinzel', serif; font-size: .56rem; letter-spacing: .15em;
  color: var(--accent-dim); text-transform: uppercase; margin-bottom: 6px;
}
.home-card-name { font-size: 1.05rem; color: var(--text-head); font-style: italic; }

/* ─── HAMBURGER ──────────────────────────────────────────────────── */
#burger {
  display: none; background: none; border: none;
  cursor: pointer; padding: 6px; color: var(--text-main);
  font-size: 1.3rem; line-height: 1;
}

/* ─── OVERLAYS ───────────────────────────────────────────────────── */
#overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.7); z-index: 99;
  backdrop-filter: blur(2px);
}
#overlay.show { display: block; }
#search-overlay { display: none; position: fixed; inset: 0; z-index: 400; }
#search-overlay.show { display: block; }

/* ─── SCROLL TO TOP ──────────────────────────────────────────────── */
#scroll-top {
  position: fixed; bottom: 28px; right: 24px;
  width: 40px; height: 40px;
  background: var(--bg-panel); border: 1px solid var(--accent-dim);
  border-radius: 50%; color: var(--accent-light);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem; z-index: 150;
  box-shadow: 0 4px 16px rgba(0,0,0,.4);
  opacity: 0; pointer-events: none;
  transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
}
#scroll-top.visible { opacity: 1; pointer-events: all; }
#scroll-top:hover { transform: translateY(-3px); box-shadow: 0 0 16px rgba(124,92,191,.4); border-color: var(--accent); }

/* ─── IMAGE ZOOM MODAL ───────────────────────────────────────────── */
#img-modal {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.9); align-items: center; justify-content: center;
  cursor: zoom-out;
}
#img-modal.open { display: flex; animation: fadeIn .2s ease; }
#img-modal img { max-width: 90vw; max-height: 88vh; border-radius: 8px; box-shadow: 0 0 60px rgba(0,0,0,.8); }

/* ─── KEYBOARD SHORTCUT MODAL ────────────────────────────────────── */
#kb-modal {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.75); align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
}
#kb-modal.open { display: flex; animation: fadeIn .2s ease; }
.kb-box {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 14px; padding: 28px 32px; max-width: 440px; width: 90%;
  box-shadow: 0 24px 60px rgba(0,0,0,.8);
}
.kb-box h3 {
  font-family: 'Cinzel', serif; font-size: 1rem; letter-spacing: .1em;
  color: var(--text-head); margin-bottom: 18px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border);
}
.kb-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
.kb-desc { font-size: .92rem; color: var(--text-dim); }
.kb-keys { display: flex; gap: 4px; }
.kb-key {
  font-family: 'Cinzel', serif; font-size: .6rem; letter-spacing: .05em;
  background: rgba(255,255,255,.06); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 7px; color: var(--text-main);
}
.kb-close-btn {
  font-family: 'Cinzel', serif; font-size: .65rem; letter-spacing: .08em;
  border: 1px solid var(--accent-dim); background: rgba(124,92,191,.1);
  color: var(--accent-light); padding: 8px 16px; border-radius: 6px;
  cursor: pointer; margin-top: 18px; transition: all var(--transition);
}
.kb-close-btn:hover { background: rgba(124,92,191,.2); }

/* ─── ORNAMENT ───────────────────────────────────────────────────── */
.page-ornament {
  text-align: center; color: var(--accent-dim); opacity: .3;
  font-size: 1rem; margin: 40px 0 20px; letter-spacing: .5em;
}

/* ═══════════════════════════════════════════════════════
   RESPONSIVE — TABLET (max 1200px)
══════════════════════════════════════════════════════ */
@media (max-width: 1200px) {
  #toc-rail { display: none !important; }
  #content-area.has-toc { margin-right: 0; }
}

/* ═══════════════════════════════════════════════════════
   RESPONSIVE — MOBILE (max 768px)
══════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  :root { --header-h: 54px; }

  #burger { display: flex; }

  /* Sidebar slides in */
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); box-shadow: 4px 0 30px rgba(0,0,0,.5); }

  /* Main fills width */
  #main { margin-left: 0; padding: 20px 16px 72px; }
  #article h1 { font-size: 1.65rem; }
  #article h2 { font-size: 1.2rem; }

  /* Search: expand to near full width on focus */
  #search-box { width: 130px; }
  #search-box:focus { width: 170px; }
  #search-dropdown { width: calc(100vw - 24px); right: -6px; max-height: 70vh; overflow-y: auto; }

  /* Hide heavy header elements */
  .nav-history { display: none; }
  .font-size-display { display: none; }
  .header-actions .icon-btn[data-tooltip="Atalhos"] { display: none; }

  /* Mobile: search becomes full overlay when open */
  body.search-open #search-dropdown { position: fixed; top: var(--header-h); left: 0; right: 0; width: 100%; border-radius: 0 0 12px 12px; z-index: 600; }

  /* Scroll to top: above mobile safe area */
  #scroll-top { bottom: calc(16px + env(safe-area-inset-bottom)); right: 16px; }
}

/* ─── MOBILE BOTTOM NAVIGATION ───────────────────────────────────── */
#mobile-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--mobile-nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(13,15,23,.95);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  z-index: 150;
  display: none;
  flex-direction: row; justify-content: space-around; align-items: center;
}
.mob-nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 8px 4px; cursor: pointer;
  background: none; border: none; color: var(--text-dim);
  transition: color var(--transition); font-size: .56rem;
  font-family: 'Cinzel', serif; letter-spacing: .05em;
}
.mob-nav-btn svg { width: 20px; height: 20px; }
.mob-nav-btn.active, .mob-nav-btn:hover { color: var(--accent-light); }

@media (max-width: 768px) {
  #mobile-nav { display: flex; }
  /* avoid content hiding behind bottom nav */
  #layout { padding-bottom: var(--mobile-nav-h); }
}

/* ─── SWIPE HINT (mobile) ────────────────────────────────────────── */
.swipe-hint {
  display: none; position: fixed; left: 0; top: 50%;
  transform: translateY(-50%); z-index: 98;
  width: 6px; height: 40px; border-radius: 0 4px 4px 0;
  background: linear-gradient(180deg, transparent, var(--accent-dim), transparent);
  opacity: .4;
}
@media (max-width: 768px) { .swipe-hint { display: block; } }
</style>
</head>

<!-- HEADER -->

<!-- MOBILE BOTTOM NAV -->

    Início

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    Menu

<script>
/* ════════════════════════════════════════════════════
   CONFIG — Nocturia
════════════════════════════════════════════════════ */
const REPO_OWNER    = 'gamesistem';
const REPO_NAME     = 'Nocturia';
const SIDEBAR_URL   = `https://raw.githubusercontent.com/wiki/${REPO_OWNER}/${REPO_NAME}/_Sidebar.md`;
const FOOTER_URL    = `https://raw.githubusercontent.com/wiki/${REPO_OWNER}/${REPO_NAME}/_Footer.md`;
const HOME_PAGE_URL = `https://raw.githubusercontent.com/wiki/${REPO_OWNER}/${REPO_NAME}/Home.md`;
const EDIT_BASE     = `https://github.com/${REPO_OWNER}/${REPO_NAME}/wiki/`;

/* ════════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════════ */
function wikiPageToRaw(href) {
  try {
    const url = new URL(href);
    const parts = url.pathname.split('/');
    if (parts[3] === 'wiki') {
      const user = parts[1], repo = parts[2];
      const page = decodeURIComponent(parts[4] || 'Home');
      return `https://raw.githubusercontent.com/wiki/${user}/${repo}/${page}.md`;
    }
  } catch(_) {}
  return null;
}

function rawToPageName(rawUrl) {
  try {
    const m = rawUrl.match(/\/([^/]+)\.md$/);
    return m ? decodeURIComponent(m[1]) : null;
  } catch(_) { return null; }
}

function escStr(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

/* ════════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════════ */
let allLinks    = [];
let activeTab   = null;
let activePage  = null;

let pageHistory  = [];
let historyIdx   = -1;
let _skipHistory = false;

let recentPages   = [];
let recentSearches = JSON.parse(sessionStorage.getItem('noc_recent_searches') || '[]');

// In-memory page cache
const pageCache = new Map();
const CACHE_MAX = 20;
let _lastError  = null;

/* ════════════════════════════════════════════════════
   FONT SIZE
════════════════════════════════════════════════════ */
const FONT_STEPS = [85, 92, 100, 108, 116, 126, 138];
let fontIdx = parseInt(localStorage.getItem('noc_font_idx') || '2');

function applyFontSize() {
  const pct = FONT_STEPS[fontIdx];
  const px  = (pct / 100) * 1.08;
  document.documentElement.style.setProperty('--article-font-size', `${px}rem`);
  const lbl = document.getElementById('font-size-label');
  if (lbl) lbl.textContent = `${pct}%`;
}
function increaseFontSize() {
  if (fontIdx < FONT_STEPS.length - 1) { fontIdx++; applyFontSize(); localStorage.setItem('noc_font_idx', fontIdx); }
}
function decreaseFontSize() {
  if (fontIdx > 0) { fontIdx--; applyFontSize(); localStorage.setItem('noc_font_idx', fontIdx); }
}
applyFontSize();

/* ════════════════════════════════════════════════════
   READING PROGRESS BAR
════════════════════════════════════════════════════ */
const progressBar = document.getElementById('read-progress');
window.addEventListener('scroll', () => {
  const doc   = document.documentElement;
  const total = doc.scrollHeight - doc.clientHeight;
  const pct   = total > 0 ? (window.scrollY / total) * 100 : 0;
  progressBar.style.width = `${Math.min(pct, 100)}%`;

  // Scroll-to-top visibility
  document.getElementById('scroll-top').classList.toggle('visible', window.scrollY > 400);
}, { passive: true });

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ════════════════════════════════════════════════════
   IMAGE ZOOM
════════════════════════════════════════════════════ */
function openImgModal(src) {
  const modal = document.getElementById('img-modal');
  document.getElementById('img-modal-img').src = src;
  modal.classList.add('open');
}
function closeImgModal() {
  document.getElementById('img-modal').classList.remove('open');
}

/* ════════════════════════════════════════════════════
   KEYBOARD SHORTCUTS MODAL
════════════════════════════════════════════════════ */
function openKbModal() { document.getElementById('kb-modal').classList.add('open'); }
function closeKbModal() { document.getElementById('kb-modal').classList.remove('open'); }

/* ════════════════════════════════════════════════════
   SIDEBAR PARSING
════════════════════════════════════════════════════ */
function parseSidebar(md) {
  const lines = md.split('\n');
  const sections = {};
  let currentTab = 'Main';

  for (const line of lines) {
    const sectionMatch = line.match(/^###\s+(.+)/);
    if (sectionMatch) {
      currentTab = sectionMatch[1].replace(':', '').trim();
      if (!sections[currentTab]) sections[currentTab] = [];
      continue;
    }
    const linkMatch = line.match(/^-\s+\[([^\]]+)\]\(([^)]+)\)/);
    if (linkMatch) {
      const label  = linkMatch[1];
      const href   = linkMatch[2];
      const rawUrl = wikiPageToRaw(href);
      if (!sections[currentTab]) sections[currentTab] = [];
      const entry = { label, href, rawUrl, tab: currentTab };
      sections[currentTab].push(entry);
      allLinks.push(entry);
    }
  }
  return sections;
}

/* ════════════════════════════════════════════════════
   BUILD SIDEBAR UI
════════════════════════════════════════════════════ */
function buildSidebar(sections) {
  const tabBar     = document.getElementById('tab-bar');
  const navContent = document.getElementById('nav-content');
  const tabs       = Object.keys(sections);
  activeTab = tabs[0] || 'Main';

  tabBar.innerHTML = tabs.map(tab =>
    `<button class="tab-pill${tab === activeTab ? ' active' : ''}"
       onclick="switchTab('${escStr(tab)}')">${tab}</button>`
  ).join('');

  navContent.innerHTML = tabs.map(tab => `
    <div class="nav-section${tab === activeTab ? ' visible' : ''}" id="nav-${CSS.escape(tab)}">
      <div class="nav-section-title">${tab}</div>
      ${sections[tab].map(link =>
        `<span class="nav-link"
          data-raw="${link.rawUrl || ''}"
          data-label="${escStr(link.label)}"
          data-tab="${escStr(tab)}"
          onclick="loadPage('${encodeURIComponent(link.rawUrl || '')}','${escStr(link.label)}','${escStr(tab)}',this)"
        >${link.label}</span>`
      ).join('')}
    </div>
  `).join('');
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-pill').forEach(b => b.classList.toggle('active', b.textContent === tab));
  document.querySelectorAll('.nav-section').forEach(s => s.classList.toggle('visible', s.id === `nav-${CSS.escape(tab)}`));
}

/* ════════════════════════════════════════════════════
   RECENTLY VISITED
════════════════════════════════════════════════════ */
function addToRecent(rawUrl, label, tab) {
  recentPages = recentPages.filter(p => p.rawUrl !== rawUrl);
  recentPages.unshift({ rawUrl, label, tab });
  if (recentPages.length > 6) recentPages.pop();
  renderRecentPages();
}

function renderRecentPages() {
  const section = document.getElementById('recent-pages-section');
  const list    = document.getElementById('recent-pages-list');
  if (!recentPages.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = recentPages.map(p => `
    <div class="recent-page-link"
         onclick="loadPage('${encodeURIComponent(p.rawUrl)}','${escStr(p.label)}','${escStr(p.tab)}',null)">
      <span class="recent-page-dot">◆</span>
      <span>${p.label}</span>
    </div>
  `).join('');
}

/* ════════════════════════════════════════════════════
   HISTORY NAVIGATION
════════════════════════════════════════════════════ */
function pushHistory(rawUrl, label, tab) {
  if (_skipHistory) return;
  if (historyIdx < pageHistory.length - 1)
    pageHistory = pageHistory.slice(0, historyIdx + 1);
  pageHistory.push({ rawUrl, label, tab });
  historyIdx = pageHistory.length - 1;
  updateHistoryButtons();
  const pageName = rawToPageName(rawUrl);
  if (pageName && pageName !== 'Home') {
    history.pushState({ rawUrl, label, tab }, '', `#${encodeURIComponent(pageName)}`);
  } else {
    history.pushState({ rawUrl: null }, '', location.pathname);
  }
}

function historyBack() {
  if (historyIdx <= 0) return;
  historyIdx--;
  const entry = pageHistory[historyIdx];
  _skipHistory = true;
  loadPage(encodeURIComponent(entry.rawUrl), entry.label, entry.tab, null);
  _skipHistory = false;
  updateHistoryButtons();
}

function historyFwd() {
  if (historyIdx >= pageHistory.length - 1) return;
  historyIdx++;
  const entry = pageHistory[historyIdx];
  _skipHistory = true;
  loadPage(encodeURIComponent(entry.rawUrl), entry.label, entry.tab, null);
  _skipHistory = false;
  updateHistoryButtons();
}

function updateHistoryButtons() {
  document.getElementById('btn-back').disabled = historyIdx <= 0;
  document.getElementById('btn-fwd').disabled  = historyIdx >= pageHistory.length - 1;
  const mobBack = document.getElementById('mob-back');
  if (mobBack) mobBack.style.opacity = historyIdx <= 0 ? '.35' : '1';
}

window.addEventListener('popstate', e => {
  if (e.state && e.state.rawUrl) {
    _skipHistory = true;
    loadPage(encodeURIComponent(e.state.rawUrl), e.state.label, e.state.tab, null);
    _skipHistory = false;
  } else {
    _skipHistory = true;
    renderHome();
    _skipHistory = false;
  }
});

/* ════════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
════════════════════════════════════════════════════ */
window.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA';

  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); focusSearch(); }
  if (e.key === '/' && !typing) { e.preventDefault(); focusSearch(); }
  if (e.altKey && e.key === 'ArrowLeft')  { e.preventDefault(); historyBack(); }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); historyFwd(); }
  if (e.key === 'Escape') {
    closeSearch(); closeImgModal(); closeKbModal();
    closeSidebar(); document.activeElement.blur?.();
  }
  if (!typing && e.key === '+') { e.preventDefault(); increaseFontSize(); }
  if (!typing && e.key === '-') { e.preventDefault(); decreaseFontSize(); }
  if (!typing && (e.key === 'h' || e.key === 'H')) goHome();
  if (!typing && e.key === '?') openKbModal();
});

/* ════════════════════════════════════════════════════
   BREADCRUMB
════════════════════════════════════════════════════ */
function setBreadcrumb(tab, label) {
  const bc = document.getElementById('breadcrumb');
  if (!label) { bc.classList.add('hidden'); return; }
  bc.classList.remove('hidden');
  bc.innerHTML = [
    `<span class="bc-item" onclick="goHome()">Início</span>`,
    `<span class="bc-sep">›</span>`,
    tab ? `<span class="bc-item" onclick="switchTab('${escStr(tab)}')">${tab}</span><span class="bc-sep">›</span>` : '',
    `<span class="bc-current">${label}</span>`,
  ].join('');
}
function clearBreadcrumb() { document.getElementById('breadcrumb').classList.add('hidden'); }

/* ════════════════════════════════════════════════════
   TABLE OF CONTENTS
════════════════════════════════════════════════════ */
let _tocObserver = null;

function buildTOC() {
  const article  = document.getElementById('article');
  const headings = Array.from(article.querySelectorAll('h2, h3'));
  const rail     = document.getElementById('toc-rail');
  const tocList  = document.getElementById('toc-list');
  const content  = document.getElementById('content-area');

  if (_tocObserver) { _tocObserver.disconnect(); _tocObserver = null; }

  if (headings.length < 2) {
    rail.classList.remove('visible');
    content.classList.remove('has-toc');
    return;
  }

  headings.forEach((h, i) => { if (!h.id) h.id = `sec-${i}`; });
  tocList.innerHTML = headings.map(h => {
    const isH3 = h.tagName === 'H3';
    return `<li class="toc-item">
      <a class="toc-link${isH3 ? ' toc-h3' : ''}" data-target="${h.id}"
         onclick="tocScroll('${h.id}')">${h.textContent}</a>
    </li>`;
  }).join('');

  rail.classList.add('visible');
  content.classList.add('has-toc');

  _tocObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const link = tocList.querySelector(`[data-target="${entry.target.id}"]`);
      if (link) link.classList.toggle('active', entry.isIntersecting);
    });
  }, { rootMargin: `-${parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) + 20}px 0px -70% 0px` });

  headings.forEach(h => _tocObserver.observe(h));
}

function tocScroll(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function clearTOC() {
  if (_tocObserver) { _tocObserver.disconnect(); _tocObserver = null; }
  document.getElementById('toc-rail').classList.remove('visible');
  document.getElementById('content-area').classList.remove('has-toc');
  document.getElementById('toc-list').innerHTML = '';
}

/* ════════════════════════════════════════════════════
   PAGE LOADER (with cache)
════════════════════════════════════════════════════ */
async function loadPage(encodedUrl, label, tab, el) {
  const rawUrl = decodeURIComponent(encodedUrl);
  activePage = rawUrl;
  _lastError = null;

  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  if (el) el.classList.add('active');
  else {
    const link = document.querySelector(`.nav-link[data-raw="${CSS.escape(rawUrl)}"]`);
    if (link) { link.classList.add('active'); switchTab(link.dataset.tab); }
  }

  switchTab(tab);
  showLoading(`Conjurando ${label}…`);
  clearTOC();
  setBreadcrumb(tab, label);

  try {
    const text = await fetchMdCached(rawUrl);
    renderArticle(text, label, tab, rawUrl);
    addToRecent(rawUrl, label, tab);
    if (!_skipHistory) pushHistory(rawUrl, label, tab);
  } catch(e) {
    _lastError = { encodedUrl, label, tab };
    showError(`Não foi possível carregar "<strong>${label}</strong>". A página pode não existir ainda.`, true);
  }

  closeSidebar();
}

async function fetchMd(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}

async function fetchMdCached(url) {
  if (pageCache.has(url)) return pageCache.get(url);
  const text = await fetchMd(url);
  // evict oldest if over limit
  if (pageCache.size >= CACHE_MAX) {
    const firstKey = pageCache.keys().next().value;
    pageCache.delete(firstKey);
  }
  pageCache.set(url, text);
  return text;
}

function retryLoad() {
  if (!_lastError) return;
  const { encodedUrl, label, tab } = _lastError;
  loadPage(encodedUrl, label, tab, null);
}

function copyPageUrl() {
  const url = window.location.href;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.querySelector('.meta-btn.copy-btn');
    if (btn) { btn.textContent = '✓ Copiado'; setTimeout(() => btn.textContent = '⎘ Copiar link', 1800); }
  });
}

/* ════════════════════════════════════════════════════
   MARKDOWN RENDERER
════════════════════════════════════════════════════ */
function makeRenderer(tab) {
  const renderer = new marked.Renderer();

  renderer.link = function(href, title, text) {
    const rawUrl = wikiPageToRaw(href);
    if (rawUrl) {
      const linkObj = allLinks.find(l => l.rawUrl === rawUrl) || { label: text, tab };
      return `<a href="#${encodeURIComponent(rawToPageName(rawUrl) || '')}"
        onclick="event.preventDefault();loadPage('${encodeURIComponent(rawUrl)}','${escStr(linkObj.label || text)}','${escStr(linkObj.tab || tab)}',null)"
        title="${escStr(title || '')}">${text}</a>`;
    }
    return `<a href="${href}" target="_blank" rel="noopener" title="${escStr(title || '')}">${text}</a>`;
  };

  renderer.image = function(src, title, alt) {
    return `<img src="${src}" alt="${alt || ''}" title="${title || ''}"
      onclick="openImgModal('${src}')" loading="lazy" />`;
  };

  return renderer;
}

function renderArticle(md, label, tab, rawUrl) {
  marked.use({ renderer: makeRenderer(tab), breaks: true });
  const html = marked.parse(md);

  const article = document.getElementById('article');
  const loading = document.getElementById('loading-state');
  loading.style.display = 'none';
  article.style.display = 'block';

  const pageName = rawToPageName(rawUrl) || label;
  const editUrl  = `${EDIT_BASE}${encodeURIComponent(pageName)}/_edit`;

  article.innerHTML = `
    <div class="article-meta">
      <span class="badge">${tab}</span>
      <div class="meta-actions">
        <button class="meta-btn copy-btn" onclick="copyPageUrl()">⎘ Copiar link</button>
        <span class="meta-sep">·</span>
        <a class="meta-btn" href="${editUrl}" target="_blank" rel="noopener" title="Editar no GitHub">✎ Editar</a>
      </div>
    </div>
    ${html}
    <div class="page-ornament">— ✦ —</div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.title = `${label} — Nocturia Wiki`;
  setTimeout(buildTOC, 50);
}

/* ════════════════════════════════════════════════════
   HOME PAGE
════════════════════════════════════════════════════ */
async function renderHome() {
  showLoading('Carregando o grimório…');
  clearTOC(); clearBreadcrumb();
  activePage = null;
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.mob-nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mob-home')?.classList.add('active');

  try {
    const homeMd = await fetchMdCached(HOME_PAGE_URL);
    marked.use({ renderer: makeRenderer('Main'), breaks: true });
    const html = marked.parse(homeMd);
    const article = document.getElementById('article');
    document.getElementById('loading-state').style.display = 'none';
    article.style.display = 'block';
    article.innerHTML = `${html}<div class="page-ornament">— ✦ —</div>`;
    document.title = 'Nocturia Wiki';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(buildTOC, 50);
  } catch(error) {
    showError('Não foi possível carregar a página inicial. Verifique sua conexão.');
  }
}

function goHome() {
  clearSearch();
  if (!_skipHistory) pushHistory(HOME_PAGE_URL, 'Início', 'Main');
  renderHome();
}

/* ════════════════════════════════════════════════════
   SEARCH
════════════════════════════════════════════════════ */
let searchTimeout, searchFocusIdx = -1;
const searchBox      = document.getElementById('search-box');
const searchDropdown = document.getElementById('search-dropdown');
const searchClear    = document.getElementById('search-clear');
const searchOverlay  = document.getElementById('search-overlay');

function focusSearch() {
  searchBox.focus(); searchBox.select(); openSearch();
}

searchBox.addEventListener('focus', openSearch);
searchBox.addEventListener('input', e => {
  const q = e.target.value;
  searchClear.classList.toggle('visible', q.length > 0);
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => renderSearchDropdown(q.trim()), 160);
});
searchBox.addEventListener('keydown', e => {
  const items = searchDropdown.querySelectorAll('.search-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    searchFocusIdx = Math.min(searchFocusIdx + 1, items.length - 1);
    updateSearchFocus(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    searchFocusIdx = Math.max(searchFocusIdx - 1, 0);
    updateSearchFocus(items);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (searchFocusIdx >= 0 && items[searchFocusIdx]) items[searchFocusIdx].click();
    else if (searchBox.value.trim()) showFullSearchResults(searchBox.value.trim());
  } else if (e.key === 'Escape') {
    closeSearch(); searchBox.blur();
  }
});

function updateSearchFocus(items) {
  items.forEach((item, i) => item.classList.toggle('focused', i === searchFocusIdx));
  if (items[searchFocusIdx]) items[searchFocusIdx].scrollIntoView({ block: 'nearest' });
}
function openSearch() {
  searchDropdown.classList.add('open');
  searchOverlay.classList.add('show');
  searchBox.setAttribute('aria-expanded', 'true');
  searchFocusIdx = -1;
  renderSearchDropdown(searchBox.value.trim());
  document.body.classList.add('search-open');
}
function closeSearch() {
  searchDropdown.classList.remove('open');
  searchOverlay.classList.remove('show');
  searchBox.setAttribute('aria-expanded', 'false');
  searchFocusIdx = -1;
  document.body.classList.remove('search-open');
}
function clearSearch() {
  searchBox.value = '';
  searchClear.classList.remove('visible');
  closeSearch();
}

function highlight(text, query) {
  if (!query) return text;
  return text.replace(new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark>$1</mark>');
}

function renderSearchDropdown(q) {
  searchFocusIdx = -1;
  if (!q) {
    if (!recentSearches.length && !recentPages.length) {
      searchDropdown.innerHTML = `<div class="search-empty">Digite para buscar páginas…</div>`;
      return;
    }
    let html = '';
    if (recentSearches.length) {
      html += `<div class="search-section-label">Buscas Recentes</div>`;
      html += recentSearches.map(s => `
        <div class="recent-item" onclick="searchBox.value='${escStr(s)}';renderSearchDropdown('${escStr(s)}')">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M6 1v5l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/>
          </svg>
          ${s}
        </div>`).join('');
      html += `<button class="recent-clear" onclick="clearRecentSearches()">Limpar histórico</button>`;
    }
    if (recentPages.length) {
      html += `<div class="search-divider"></div>`;
      html += `<div class="search-section-label">Visitadas Recentemente</div>`;
      html += recentPages.map(p => `
        <div class="search-item" onclick="closeSearch();loadPage('${encodeURIComponent(p.rawUrl)}','${escStr(p.label)}','${escStr(p.tab)}',null)">
          <div class="search-item-icon">${p.tab.charAt(0)}</div>
          <div class="search-item-body">
            <div class="search-item-title">${p.label}</div>
            <div class="search-item-sub">${p.tab}</div>
          </div>
          <span class="search-item-arrow">›</span>
        </div>`).join('');
    }
    searchDropdown.innerHTML = html;
    return;
  }

  const ql      = q.toLowerCase();
  const results = allLinks.filter(l => l.label.toLowerCase().includes(ql));

  if (!results.length) {
    searchDropdown.innerHTML = `
      <div class="search-header">
        <span class="search-count">0 resultados para "${q}"</span>
      </div>
      <div class="search-empty">Nenhuma página encontrada.<br>
        <span style="font-size:.8rem">Verifique a ortografia ou tente outro termo.</span>
      </div>`;
    return;
  }

  const shown = results.slice(0, 8);
  const more  = results.length - shown.length;
  const grouped = {};
  shown.forEach(l => { if (!grouped[l.tab]) grouped[l.tab] = []; grouped[l.tab].push(l); });

  let html = `
    <div class="search-header">
      <span class="search-count">${results.length} resultado${results.length !== 1 ? 's' : ''}</span>
      <span class="search-hint">↑↓ navegar · Enter abrir</span>
    </div>
    <div class="search-list">`;

  Object.entries(grouped).forEach(([tab, links]) => {
    html += `<div class="search-section-label">${tab}</div>`;
    links.forEach(l => {
      html += `
        <div class="search-item" role="option"
             onclick="handleSearchSelect('${encodeURIComponent(l.rawUrl||'')}','${escStr(l.label)}','${escStr(l.tab)}')">
          <div class="search-item-icon">${tab.charAt(0)}</div>
          <div class="search-item-body">
            <div class="search-item-title">${highlight(l.label, q)}</div>
            <div class="search-item-sub">${l.tab}</div>
          </div>
          <span class="search-item-arrow">›</span>
        </div>`;
    });
  });

  if (more > 0) {
    html += `<div class="search-divider"></div>
      <div class="recent-item" onclick="showFullSearchResults('${escStr(q)}')">
        Ver todos os ${results.length} resultados →
      </div>`;
  }
  html += `</div>`;
  searchDropdown.innerHTML = html;
}

function handleSearchSelect(encodedUrl, label, tab) {
  saveRecentSearch(searchBox.value.trim());
  closeSearch();
  loadPage(encodedUrl, label, tab, null);
}

function showFullSearchResults(q) {
  saveRecentSearch(q);
  closeSearch();
  const ql = q.toLowerCase();
  const results = allLinks.filter(l => l.label.toLowerCase().includes(ql));
  const article = document.getElementById('article');
  document.getElementById('loading-state').style.display = 'none';
  article.style.display = 'block';
  clearTOC(); clearBreadcrumb();

  if (!results.length) {
    article.innerHTML = `
      <div class="search-results-page">
        <h1>Busca: "${q}"</h1>
        <p style="color:var(--text-dim);font-style:italic;margin-top:16px">Nenhum resultado encontrado.</p>
      </div>`;
  } else {
    const grouped = {};
    results.forEach(l => { if (!grouped[l.tab]) grouped[l.tab] = []; grouped[l.tab].push(l); });
    article.innerHTML = `
      <div class="search-results-page">
        <h1>Busca: "${q}"</h1>
        <p style="color:var(--text-dim);font-size:.9rem;margin:8px 0 4px">
          ${results.length} resultado${results.length !== 1 ? 's' : ''} encontrado${results.length !== 1 ? 's' : ''}
        </p>
        <div class="search-result-grid">
          ${results.map(l => `
            <div class="search-result-item"
                 onclick="loadPage('${encodeURIComponent(l.rawUrl||'')}','${escStr(l.label)}','${escStr(l.tab)}',null)">
              <div class="search-result-icon">${l.tab.charAt(0)}</div>
              <div class="search-result-body">
                <div class="search-result-title">${highlight(l.label, q)}</div>
                <div class="search-result-sub">${l.tab}</div>
              </div>
              <span class="search-result-arrow">›</span>
            </div>`).join('')}
        </div>
      </div>`;
  }
  document.title = `Busca: ${q} — Nocturia Wiki`;
}

/* ════════════════════════════════════════════════════
   RECENT SEARCHES
════════════════════════════════════════════════════ */
function saveRecentSearch(q) {
  if (!q) return;
  recentSearches = [q, ...recentSearches.filter(s => s !== q)].slice(0, 6);
  sessionStorage.setItem('noc_recent_searches', JSON.stringify(recentSearches));
}
function clearRecentSearches() {
  recentSearches = [];
  sessionStorage.removeItem('noc_recent_searches');
  renderSearchDropdown('');
}

/* ════════════════════════════════════════════════════
   STATES
════════════════════════════════════════════════════ */
function showLoading(msg) {
  const art = document.getElementById('article');
  const ld  = document.getElementById('loading-state');
  art.style.display = 'none';
  ld.style.display  = 'flex';
  ld.innerHTML = `<div class="state-rune">✦</div><div class="state-msg">${msg || 'Carregando…'}</div>`;
}
function showError(msg, canRetry = false) {
  const art = document.getElementById('article');
  const ld  = document.getElementById('loading-state');
  art.style.display = 'none';
  ld.style.display  = 'flex';
  ld.innerHTML = `
    <div class="state-rune" style="color:var(--crimson);opacity:.6">✖</div>
    <div class="state-msg">${msg}</div>
    ${canRetry ? `<button class="retry-btn" onclick="retryLoad()">↺ Tentar novamente</button>` : ''}
  `;
}

/* ════════════════════════════════════════════════════
   MOBILE SIDEBAR + SWIPE GESTURES
════════════════════════════════════════════════════ */
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const isOpen  = sidebar.classList.toggle('open');
  overlay.classList.toggle('show', isOpen);
  document.body.style.overflow = isOpen ? 'hidden' : '';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow = '';
}

// Swipe to open/close sidebar
(function initSwipe() {
  let startX = 0, startY = 0, dragging = false;
  const THRESHOLD = 50, EDGE = 30;

  document.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dragging = startX < EDGE; // only from left edge
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dx = e.touches[0].clientX - startX;
    const dy = Math.abs(e.touches[0].clientY - startY);
    if (dy > 40) { dragging = false; return; }
    // Prevent vertical scroll while swiping horizontally
    if (Math.abs(dx) > 10) e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    const dx = e.changedTouches[0].clientX - startX;
    if (dx > THRESHOLD) toggleSidebar();
  }, { passive: true });

  // Swipe left to close sidebar
  document.getElementById('sidebar').addEventListener('touchstart', e => {
    startX = e.touches[0].clientX; dragging = true;
  }, { passive: true });
  document.getElementById('sidebar').addEventListener('touchend', e => {
    if (!dragging) return; dragging = false;
    const dx = e.changedTouches[0].clientX - startX;
    if (dx < -THRESHOLD) closeSidebar();
  }, { passive: true });
})();

/* ════════════════════════════════════════════════════
   FOOTER
════════════════════════════════════════════════════ */
async function loadFooter() {
  try {
    const md = await fetchMd(FOOTER_URL);
    const plain = md.replace(/\*\*/g,'').replace(/\*/g,'').replace(/^#+.*/gm,'').replace(/^>{1,}\s*/gm,'').trim();
    document.getElementById('sidebar-footer').innerText = plain;
  } catch(_) {}
}

/* ════════════════════════════════════════════════════
   HASH ROUTING
════════════════════════════════════════════════════ */
function resolveHashOnLoad() {
  const hash = decodeURIComponent(window.location.hash.slice(1));
  if (!hash) return false;
  const match = allLinks.find(l => {
    const name = rawToPageName(l.rawUrl);
    return name && name.toLowerCase() === hash.toLowerCase();
  });
  if (match) {
    loadPage(encodeURIComponent(match.rawUrl), match.label, match.tab, null);
    return true;
  }
  const rawUrl = `https://raw.githubusercontent.com/wiki/${REPO_OWNER}/${REPO_NAME}/${hash}.md`;
  loadPage(encodeURIComponent(rawUrl), hash.replace(/-/g,' '), 'Main', null);
  return true;
}

/* ════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════ */
async function init() {
  showLoading('Invocando o grimório…');

  const [sidebarMd] = await Promise.all([
    fetchMd(SIDEBAR_URL).catch(() => `### Main\n- [Página Inicial](https://github.com/${REPO_OWNER}/${REPO_NAME}/wiki/Home)`),
    loadFooter(),
  ]);

  const sections = parseSidebar(sidebarMd);
  buildSidebar(sections);

  if (!resolveHashOnLoad()) {
    await renderHome();
  }
}

init();
</script>
